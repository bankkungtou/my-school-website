apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-website
  labels:
    app: school-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: school-website
  template:
    metadata:
      labels:
        app: school-website
    spec:
      containers:
      - name: school-website
        image: your-registry/school-website:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5