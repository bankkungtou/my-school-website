apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: school-website-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: school.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: school-website-service
            port:
              number: 80